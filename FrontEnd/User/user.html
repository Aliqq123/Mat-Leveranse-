<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User</title>

  <!-- Användarprofil-styling -->
  <link rel="stylesheet" href="../User/user.css" />

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  />
</head>
<body>

  <!-- ====== NAVBAR ====== -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">

      <!-- Logotyp länkad till inloggad startsida -->
      <a class="navbar-brand" href="../Home-log-in/home.html">
        <img id="logo" src="../Images/foodie.png" alt="Foodie" />
      </a>

      <!-- Hamburgarmeny för mobil -->
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">

          <!-- Länk till kundvagn -->
          <li class="nav-item">
            <a class="nav-link" href="../Cart/cart.html">
              <img id="cartlogo" src="../Images/cart.png" alt="Cart" />
            </a>
          </li>

          <!-- Länk till adminpanel -->
          <li class="nav-item">
            <a class="nav-link" id="nav-admin-link" href="../admin/admin.html">
              <img id="adminlogo" src="../Images/admin.png" alt="Admin" />
            </a>
          </li>

          <!-- Länk till användarprofil (aktuell sida) -->
          <li class="nav-item">
            <a class="nav-link" href="../User/user.html">
              <img id="userlogo" src="../Images/user.png" alt="User" />
            </a>
          </li>

        </ul>
      </div>
    </div>
  </nav>
  <!-- ====== SLUT NAVBAR ====== -->

  <!-- ====== ANVÄNDARPROFIL ====== -->
  <!-- Backend: profildata hämtas via session och injiceras i elementen nedan -->
  <section id="user-profile-section">

    <!-- Profilbild med ändra-knapp -->
    <div class="profile-picture-container">
      <img
        id="profile-picture"
        src="../Images/user2.png"
        alt="Profile"
      />
      <button class="btn btn-outline-light btn-sm change-btn">Ändra</button>
    </div>

    <!-- Namn -->
    <div class="input-group mb-3">
      <input type="text" class="form-control" id="user-name-input" value="Name Lastname">
      <button class="btn btn-outline-light change-btn" type="button">Ändra</button>
    </div>

    <!-- Email -->
    <div class="input-group mb-3">
      <input type="email" class="form-control" id="user-email-input" value="abasicuser@gmail.com">
      <button class="btn btn-outline-light change-btn" type="button">Ändra</button>
    </div>

    <!-- Mobilnummer -->
    <div class="input-group mb-3">
      <input type="tel" class="form-control" id="user-phone-input" value="+460793149013">
      <button class="btn btn-outline-light change-btn" type="button">Ändra</button>
    </div>

  </section>

  <!-- ====== SLUT ANVÄNDARPROFIL ====== -->

</body>
</html>
