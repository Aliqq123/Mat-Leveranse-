<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Användarprofil-styling -->
    <link rel="stylesheet" href="../User/user.css" />

    <!-- Bootstrap 5 -->

      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!-- ====== NAVBAR ====== -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <!-- Logotyp länkad till inloggad startsida -->
        <a class="navbar-brand" href="../Home-log-in/home.html">
          <img id="logo" src="../Images/foodie.png" alt="Foodie" />
        </a>

        <!-- Hamburgarmeny för mobil -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <!-- Länk till kontakt -->
                <li class="nav-item">
              <a class="nav-link" href="../Contact/contact.html">
                <img id="userlogo" src="../Images/details.png" alt="User" />
              </a>
            </li>
            <!-- Länk till kundvagn -->
            <li class="nav-item">
              <a class="nav-link" href="../Cart/cart.html">
                <img id="cartlogo" src="../Images/cart.png" alt="Cart" />
              </a>
            </li>

            <!-- Länk till adminpanel -->
            <li class="nav-item">
              <a
                class="nav-link"
                id="nav-admin-link"
                href="../admin/admin.html"
              >
                <img id="adminlogo" src="../Images/admin.png" alt="Admin" />
              </a>
            </li>

            <!-- Länk till användarprofil (aktuell sida) -->
            <li class="nav-item">
              <a class="nav-link" href="../User/user.html">
                <img id="userlogo" src="../Images/user.png" alt="User" />
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- ====== SLUT NAVBAR ====== -->

    <!-- ====== ANVÄNDARPROFIL ====== -->
    <!-- Backend: profildata hämtas via session och injiceras i elementen nedan -->
    <section id="user-profile-section">
      <!-- Profilbild med ändra-knapp -->
      <div class="profile-picture-container">

        <img
          id="profile-picture"
          src="../Images/user2.png"
          alt="Profile"
        />
      
        <input
          type="file"
          id="profile-image-input"
          hidden
        />
      
        <button
          class="btn btn-outline-light btn-sm change-btn"
          onclick="document.getElementById('profile-image-input').click()"
        >
          Ändra
        </button>
      
      </div>

      <!-- Namn -->
      <div class="input-group mb-3">
        <input
          type="text"
          class="form-control"
          id="user-name-input"
          value="Name Lastname"
        />
        <button class="btn btn-outline-light change-btn" type="button">
          Ändra
        </button>
      </div>

      <!-- Email -->
      <div class="input-group mb-3">
        <input
          type="email"
          class="form-control"
          id="user-email-input"
          value="abasicuser@gmail.com"
        />
        <button class="btn btn-outline-light change-btn" type="button">
          Ändra
        </button>
      </div>

      <!-- Mobilnummer -->
      <div class="input-group mb-3">
        <input
          type="tel"
          class="form-control"
          id="user-phone-input"
          value="+460793149013"
        />
        <button class="btn btn-outline-light change-btn" type="button">
          Ändra
        </button>
      </div>
      <button
      id="save-profile-btn"
      class="btn btn-dark w-100"
    >
      Spara profil
    </button>
    </section>

    <!-- ====== SLUT ANVÄNDARPROFIL ====== -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./auth_UI.js"></script>

    <script>

      const user =
        JSON.parse(
          localStorage.getItem("user")
        );
      
      if (user) {
      
        document.getElementById(
          "user-name-input"
        ).value = user.username;
      
        document.getElementById(
          "user-email-input"
        ).value = user.email;
      
        document.getElementById(
          "user-phone-input"
        ).value = user.phone;
      
        if (user.profile_image) {
      
          document.getElementById(
            "profile-picture"
          ).src = user.profile_image;
      
        }
      
      }
      
      document
        .getElementById(
          "save-profile-btn"
        )
        .addEventListener(
          "click",
          async () => {
      
            const formData =
              new FormData();
      
            formData.append(
              "id",
              user.id
            );
      
            formData.append(
              "username",
              document.getElementById(
                "user-name-input"
              ).value
            );
      
            formData.append(
              "email",
              document.getElementById(
                "user-email-input"
              ).value
            );
      
            formData.append(
              "phone",
              document.getElementById(
                "user-phone-input"
              ).value
            );
      
            const imageFile =
              document.getElementById(
                "profile-image-input"
              ).files[0];
      
            if (imageFile) {
      
              formData.append(
                "profileImage",
                imageFile
              );
      
            }
      
            const res =
              await fetch(
                "/api/users/update",
                {
                  method: "PUT",
                  body: formData
                }
              );
      
            const data =
              await res.json();
      
            localStorage.setItem(
              "user",
              JSON.stringify(data.user)
            );
      
            alert("Profil uppdaterad!");
      
            location.reload();
      
          }
        );
      
      </script>
  </body>
</html>
