<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foodie</title>

    <!-- Delad layout-styling (navbar, galleri, filter) -->

    <!-- Bootstrap 5 -->

      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!-- ====== NAVBAR (inloggad användare) ====== -->

          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <!-- Länk till kontakt -->

            <!-- Länk till kundvagn -->

    <!-- ====== SLUT NAVBAR ====== -->

    <!-- ====== HUVUDINNEHÅLL ====== -->
    <div class="content-row">
      <!-- Filterpanel (fast vänsterspalt) -->
      <!-- Backend: checkboxarna kopplas till filterlogik via JS -->
      <aside id="filter-panel" class="filters-box">
        <h3>Platser</h3>

        <label>
          <input type="checkbox" class="place-filter" value="Amons Kebab" />
          Amos Kebab
        </label>
        
        <label>
          <input type="checkbox" class="place-filter" value="Bogdans Pizzaria" />
          Bogdans Pizzeria
        </label>
        
        <label>
          <input type="checkbox" class="place-filter" value="KFC" />
          KFC
        </label>
        
        <label>
          <input type="checkbox" class="place-filter" value="Wing Wongs Ricefarm" />
          Wing Wongs Ricefarm
        </label>
        
        <h3>Val</h3>
        
        <label>
          <input type="checkbox" class="type-filter" value="Nötkött" />
          Nötkött
        </label>
        
        <label>
          <input type="checkbox" class="type-filter" value="Kyckling" />
          Kyckling
        </label>
        
        <label>
          <input type="checkbox" class="type-filter" value="Fisk" />
          Fisk
        </label>
        
        <label>
          <input type="checkbox" class="type-filter" value="Vegetariskt" />
          Vegetariskt
        </label>
        
        <label>
          <input type="checkbox" class="type-filter" value="Dessert" />
          Dessert
        </label>

      </aside>

      <!-- Matgalleri — bilder laddas dynamiskt från backend -->
      <section id="food-gallery" class="gallery">
      </section>
    </div>
    <!-- ====== SLUT HUVUDINNEHÅLL ====== -->

    <div id="itemModal" class="modal">
      <div class="modal-content" id="modelback">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <span class="close" onclick="closeModal()">&times;</span>

          <h2 class="mb-0 flex-grow-1 text-center" id="modalTitle"></h2>

          <div style="width: 30px"></div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3 mb-md-0">
            <img
              src=""
              alt="Food Item"
              class="img-fluid w-100 rounded"
              id="modalImage"
            />
          </div>

          <div class="col-md-6">
            <h3 id="modalName"></h3>
            <p id="modalDescription"></p>
          </div>
        </div>

        <!-- Quantity select & Add to Cart button -->
        <div class="d-flex justify-content-end mt-3">
         <select
           id="quantitySelect"
           class="form-select"
           aria-label="Quantity"
           style="width: auto; max-width: 300px; margin-right: 1rem"
         >
          <option selected>Open this select amount</option>
          <option value="1">1</option> 
          <option value="2">2</option> 
          <option value="3">3</option> 
          <option value="4">4</option> 
          <option value="5">5</option> 
          <option value="6">6</option> 
          <option value="7">7</option> 
          <option value="8">8</option> 
         </select>
        </div>

        <button
          id="addToCartBtn"
          type="button"
          class="btn btn-dark w-100 rounded-pill mt-3"
          style="height: 6vh"
        >
          Add to Order • SEK <span id="modalPrice"></span>
        </button>
        
      </div>
      
    </div>

    <script src="popup.js"></script>
    <script src="../User/auth_UI.js"></script> <!--Detta js fill för att gömma admin ikonen från användare (rör inte på den)-->

    <script>
      // Här är koden för att visa producten på hemsidan (obs du behöver ladd ner images själv)
      async function loadProducts() {
        const res = await fetch("/api/products");
        const products = await res.json();

        const container = document.getElementById("food-gallery");

        container.innerHTML = products
          .map(
            (p) => `
          <button
            style="all: unset"
            onclick='openModal(${JSON.stringify(p)})'
          >
            <div class="gallery-item">
              <img class="gallery-image" src="${p.product_image}" alt="food" />

              <div class="gallery-overlay">
                <h4>${p.product_name}</h4>
                <p>${p.product_description}</p>
                <p>Pris: ${p.product_price} kr</p>
              </div>
            </div>
          </button>
        `,
          )
          .join("");
      }

      loadProducts();
    </script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script>

      let allProducts = [];
      
      async function loadProducts() {
      
        try {
      
          const res =
            await fetch("/api/products");
      
          allProducts =
            await res.json();
      
          renderProducts(allProducts);
      
        } catch (err) {
      
          console.error(
            "Kunde inte ladda produkter:",
            err
          );
      
        }
      
      }
      
      function renderProducts(products) {
      
        const container =
          document.getElementById(
            "food-gallery"
          );
      
        container.innerHTML =
          products.map(p => `
      
            <button
              onclick="openModal()"
              style="all: unset"
            >
      
              <div class="gallery-item">
      
                <img
                  class="gallery-image"
                  src="${p.product_image}"
                  alt="${p.product_name}"
                />
      
                <div class="gallery-overlay">
      
                  <h4>${p.product_name}</h4>
      
                  <p>
                    ${p.product_description}
                  </p>
      
                  <p>
                    Pris:
                    ${p.product_price} kr
                  </p>
      
                  <p>
                    Restaurang:
                    ${p.product_origin}
                  </p>
      
                  <p>
                    Typ:
                    ${p.product_type}
                  </p>
      
                </div>
      
              </div>
      
            </button>
      
          `).join("");
      
      }
      
      function filterProducts() {
      
        // Alla valda restauranger
        const selectedPlaces =
          [...document.querySelectorAll(".place-filter:checked")]
          .map(cb => cb.value);
      
        // Alla valda typer
        const selectedTypes =
          [...document.querySelectorAll(".type-filter:checked")]
          .map(cb => cb.value);
      
        const filtered =
          allProducts.filter(product => {
      
            // Match restaurang
            const matchPlace =
              selectedPlaces.length === 0 ||
              selectedPlaces.includes(
                product.product_origin
              );
      
            // Match typ
            const matchType =
              selectedTypes.length === 0 ||
              selectedTypes.includes(
                product.product_type
              );
      
            return matchPlace && matchType;
      
          });
      
        renderProducts(filtered);
      
      }
      
      // Lyssna på alla checkboxes
      document
        .querySelectorAll(
          ".place-filter, .type-filter"
        )
        .forEach(cb => {
      
          cb.addEventListener(
            "change",
            filterProducts
          );
      
        });
      
      loadProducts();
      </script>
  </body>
</html>
