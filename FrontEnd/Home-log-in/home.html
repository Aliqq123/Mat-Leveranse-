    <div id="itemModal" class="modal">
      <div class="modal-content" id="modelback">

        </div>

        <!-- Quantity select & Add to Cart button -->

         <select

           aria-label="Quantity"

         >

          <option value="1">1</option> 
          <option value="2">2</option>

          <option value="5">5</option>

    <script>
      // Här är koden för att visa producten på hemsidan (obs du behöver ladd ner images själv)
      async function loadProducts() {
        const res = await fetch("/api/products");
        const products = await res.json();

        const container = document.getElementById("food-gallery");

        container.innerHTML = products
          .map(
            (p) => `
          <button
            style="all: unset"
            onclick='openModal(${JSON.stringify(p)})'
          >
            <div class="gallery-item">
              <img class="gallery-image" src="${p.product_image}" alt="food" />

              <div class="gallery-overlay">
                <h4>${p.product_name}</h4>
                <p>${p.product_description}</p>
                <p>Pris: ${p.product_price} kr</p>
              </div>
            </div>
          </button>
        `,
          )
          .join("");
      }

      loadProducts();
    </script>
