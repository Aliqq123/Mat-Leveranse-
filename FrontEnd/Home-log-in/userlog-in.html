<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User</title>

  <!-- Delad layout-styling -->
  <link rel="stylesheet" href="/FrontEnd/Home-log-in/style.css" />

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  />
</head>
<body>

  <!-- ====== NAVBAR ====== -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">

      <!-- Logotyp -->
      <a class="navbar-brand" href="/FrontEnd/Home/index.html">
        <img id="logo" src="../Images/foodie.png" alt="Foodie" />
      </a>

      <!-- Hamburgarmeny för mobil -->
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"></li>
        </ul>

        <!-- Inloggningsknapp — synlig för icke-inloggade -->
        <a class="navbar-brand" href="/FrontEnd/logout-login/login.html">
          <h2 class="buttoninfouser">Login In</h2>
        </a>
      </div>

    </div>
  </nav>
  <!-- ====== SLUT NAVBAR ====== -->

  <!-- ====== ANVÄNDARPROFIL (gäst-förhandsgranskning) ====== -->
  <!-- Backend: profilbild och namn hämtas via session/API -->
  <section id="user-profile-section">
    <img
      id="profile-picture"
      src="/FrontEnd/Images/user2.png"
      alt="Profile"
    />
    <!-- Backend fyller i användarens riktiga namn här -->
    <h1 class="textnames" id="user-display-name">Name Lastname</h1>
  </section>
  <!-- ====== SLUT ANVÄNDARPROFIL ====== -->

</body>
</html>
