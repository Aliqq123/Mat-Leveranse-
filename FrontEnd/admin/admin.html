<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Inventory</title>

  <!-- Adminstyling -->
  <link rel="stylesheet" href="../admin/admin.css" />

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  />
</head>
<body>
<!--Skydd! Bara admin redigera produkter-->
  <script>

    const user =
      JSON.parse(localStorage.getItem("user"));
    
    if (!user || user.role !== "admin") {
    
      window.location.href =
        "../Home-log-in/home.html";
    
    }
    
    </script>

  <!-- ====== NAVBAR ====== -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">

      <!-- Logotyp -->
      <a class="navbar-brand" href="../Home-log-in/home.html">
        <img id="logo" src="../Images/foodie.png" alt="Foodie" />
      </a>

      <!-- Hamburgarmeny för mobil -->
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">

          <!-- Länk till kundvagn -->
          <li class="nav-item">
            <a class="nav-link" href="../Cart/cart.html">
              <img id="cartlogo" src="../Images/cart.png" alt="Cart" />
            </a>
          </li>

          <!-- Länk till admin-hantering (subadmin) — aktiv sida-indikator kan sättas via backend -->
          <li class="nav-item">
            <a class="nav-link" id="nav-subadmin-link" href="../admin/subadmin.html">
              <img id="adminlogo" src="../Images/admin_manage.png" alt="Admin" />
            </a>
          </li>

          <!-- Länk till användarprofil -->
          <li class="nav-item">
            <a class="nav-link" href="../User/user.html">
              <img id="userlogo" src="../Images/user.png" alt="User" />
            </a>
          </li>

        </ul>
      </div>
    </div>
  </nav>
  <!-- ====== SLUT NAVBAR ====== -->

  <!-- ====== LAGERHANTERING ====== -->
  <!-- Backend: tabellen fylls dynamiskt med produktdata från databasen -->
  <main id="admin-inventory" class="container d-flex flex-column align-items-center mt-4">

    <h3 class="mb-3">Inventory</h3>

    <!-- Produkttabell — max 80vw bred -->
    <div class="inventory-table-wrapper">
      <table id="inventory-table" class="table table-striped-columns border border-dark">
        <thead>
          <tr>
            <th scope="col">Id</th>
            <th scope="col">Product Name</th>
            <th scope="col">Origin Name</th>
            <th scope="col">Type</th>
            <th scope="col">Price</th>
          </tr>
        </thead>
        <!-- Backend renderar <tr> för varje produkt här -->
          <tbody id="inventory-table-body">
            
          </tbody>
      </table>
    </div>

  </main>
  <!-- ====== SLUT LAGERHANTERING ====== -->

  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
  ></script>
  <script>
    async function loadInventory() {
      const res = await fetch("/api/admin");
      const products = await res.json();
    
      const tableBody = document.getElementById("inventory-table-body");
    
      tableBody.innerHTML = products.map(p => `
        <tr>
          <td>${p.product_id}</td>
          <td>${p.product_name}</td>
          <td>${p.product_origin}</td>
          <td>${p.product_type}</td>
          <td>${p.product_price} kr</td>
        </tr>
      `).join("");
    }
    
    loadInventory();
    </script>

</body>
</html>
