<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logga in</title>

    <link rel="stylesheet" href="login.css" />
  </head>

  <body>
    <nav class="navbar">
      <div class="nav-container">
        <a href="/FrontEnd/Home-log-in/home.html">
          <img id="logo" src="../Images/foodie.png" alt="Foodie" />
        </a>

        <button class="menu-toggle">☰</button>
      </div>
    </nav>

    <div class="page-center">
      <div class="card">
        <h3 class="title">Logga in</h3>

        <form id="loginForm">
          <div class="form-group">
            <label for="loginEmail">E-post</label>
            <input
              type="email"
              id="loginEmail"
              placeholder="namn@exempel.se"
              required
            />
          </div>

          <div class="form-group">
            <label for="loginPassword">Lösenord</label>
            <input
              type="password"
              id="loginPassword"
              placeholder="********"
              required
            />
          </div>

          <button type="submit" class="btn btn-dark">
            Logga in
          </button>
        </form>

        <a href="sign.html">
          <button class="btn btn-light">Sign in</button>
        </a>
      </div>
    </div>
  </body>
  <script src="/js/auth.js"></script>
</html>
