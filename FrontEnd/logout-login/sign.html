<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="stylesheet" href="/FrontEnd/logout-login/log.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        height: 100vh;
        overflow: hidden;
      }

      .center-wrapper {
        height: calc(100vh - 60px); /* minus navbar */
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .card-box {
        width: 400px;
        height: 520px;
        border: 2px solid black;
        border-radius: 30px;
        padding: 30px;
        background-color: white;
      }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="/FrontEnd/Home/index.html">
          <img id="logo" src="../Images/foodie.png" alt="Foodie" />
        </a>
      </div>
    </nav>

    <div class="center-wrapper">
      <div class="card-box">
        <h3 class="text-center mb-3">Sign in</h3>

        <form id="loginForm">
          <div class="mb-2">
            <label for="loginUsername" class="form-label">Användarnamn</label>
            <input type="text" class="form-control" required />
          </div>

          <div class="mb-2">
            <label class="form-label">E-post</label>
            <input type="email" class="form-control" required />
          </div>

          <div class="mb-2">
            <label class="form-label">Phone Number</label>
            <input type="tel" class="form-control" required />
          </div>

          <div class="mb-3">
            <label class="form-label">Lösenord</label>
            <input type="password" class="form-control" required />
          </div>

          <button type="submit" class="btn btn-dark w-100 rounded-pill">
            Sign in
          </button>
        </form>

        <a href="login.html">
          <button class="btn btn-light w-100 rounded-pill mt-2">
            Logga in
          </button>
        </a>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
