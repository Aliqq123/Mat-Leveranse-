<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in</title>

    <link rel="stylesheet" href="sign.css" />
  </head>

  <body>
    <nav class="navbar"> <!-- Meny,tillhör ej i inlognings formulär-->
      <div class="nav-container">
        <a href="/FrontEnd/Home/index.html" class="logo-link">
          <img id="logo" src="../Images/foodie.png" alt="Foodie" />
        </a>

        <button class="menu-toggle">☰</button>
      </div>
    </nav>

    <div class="page-center"> <!--Inloggnings formulär startar här, dvs container-->
      <div class="card">
        <h3 class="title">Sign in</h3>

        <form id="loginForm">
          <div class="form-group">
            <label for="loginUsername">Användarnamn</label>
            <input type="text" id="loginUsername" placeholder="Ditt användarnamn" required />
          </div>

          <div class="form-group">
            <label for="loginEmail">E-post</label>
            <input type="email" id="loginEmail" placeholder="namn@exempel.se" required />
          </div>

          <div class="form-group">
            <label for="loginPhoneNumber">Phone Number</label>
            <input
              type="phone"
              id="loginPhoneNumber"
              pattern="^(070|072|073|076|079)[0-9]{7}$"
              placeholder="07xxxxxxxx"
              required
            />
          </div>

          <div class="form-group">
            <label for="loginPassword">Lösenord</label>
            <input type="password" id="loginPassword" placeholder="********" required />
          </div>

          <button type="submit" class="btn btn-dark">Sign in</button>
        </form>

        <a href="login.html">
          <button class="btn btn-light">Logga in</button>
        </a>
      </div>
    </div>
  </body>

  <script src="/js/auth.js"></script>
</html>
