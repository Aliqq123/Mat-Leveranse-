<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrera — Foodie</title>

    <!-- Inloggningsstyling (delas med login.html) -->
    <link rel="stylesheet" href="../logout-login/log.css" />

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!-- ====== NAVBAR ====== -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <!-- Logotyp länkad till gäst-startsida -->
        <a class="navbar-brand" href="/FrontEnd/Home/index.html">
          <img id="logo" src="../Images/foodie.png" alt="Foodie" />
        </a>
      </div>
    </nav>
    <!-- ====== SLUT NAVBAR ====== -->

    <!-- ====== REGISTRERINGSFORMULÄR ====== -->
    <!-- Backend: formuläret POST:ar användardata för att skapa nytt konto -->
    <div class="center-wrapper">
      <div class="auth-card">
        <h3 class="text-center mb-3">Sign in</h3>

        <form id="register-form">
          <!-- Användarnamn -->
          <div class="mb-2">
            <label for="register-username" class="form-label"
              >Användarnamn</label
            >
            <input
              type="text"
              class="form-control"
              id="register-username"
              name="username"
              required
            />
          </div>

          <!-- E-post -->
          <div class="mb-2">
            <label for="register-email" class="form-label">E-post</label>
            <input
              type="email"
              class="form-control"
              id="register-email"
              name="email"
              required
            />
          </div>

          <!-- Telefonnummer -->
          <div class="mb-2">
            <label for="register-phone" class="form-label">Phone Number</label>
            <input
              type="tel"
              class="form-control"
              id="register-phone"
              name="phone"
              pattern="^07[02369]\d{7}$"
              maxlength="10"
              required
            />
          </div>

          <!-- Lösenord -->
          <div class="mb-3">
            <label for="register-password" class="form-label">Lösenord</label>
            <input
              type="password"
              class="form-control"
              id="register-password"
              name="password"
              required
            />
          </div>

          <!-- Registreringsknapp -->
          <button type="submit" class="btn btn-dark w-100 rounded-pill">
            Sign in
          </button>
        </form>

        <!-- Länk tillbaka till inloggningssidan -->
        <a href="login.html">
          <button type="button" class="btn btn-light w-100 rounded-pill mt-2">
            Logga in
          </button>
        </a>
      </div>
    </div>
    <!-- ====== SLUT REGISTRERINGSFORMULÄR ====== -->

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!--Ta inte bort denna script, den tillhör för sign up-->
    <script>
      const registerForm = document.getElementById("register-form");

      registerForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const username = document.getElementById("register-username").value;

        const email = document.getElementById("register-email").value;

        const phone = document.getElementById("register-phone").value;

        const password = document.getElementById("register-password").value;

        const response = await fetch("/api/users/signup", {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
          },

          body: JSON.stringify({
            username,
            email,
            phone,
            password,
          }),
        });

        const data = await response.json();

        alert(data.message);
      });
    </script>
  </body>
</html>
