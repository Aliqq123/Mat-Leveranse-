<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foodie</title>

    <!-- Delad layout-styling (navbar, galleri, filter) -->
    <link rel="stylesheet" href="../Home-log-in/style.css" />

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!-- ====== NAVBAR (gäst-vy, utan inloggning) ====== -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <!-- Logotyp länkad till startsidan -->
        <a class="navbar-brand" href="/FrontEnd/Home/index.html">
          <img id="logo" src="../Images/foodie.png" alt="Foodie" />
        </a>

        <!-- Hamburgarmeny för mobil -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"></li>
          </ul>
          <!-- Inloggningsknapp — synlig för icke-inloggade användare -->
          <a class="navbar-brand" href="../logout-login/login.html"
            ><h3 class="LogSign login">Login</h3></a
          >
          <a class="navbar-brand" href="../logout-login/sign.html"
            ><h3 class="LogSign signup">Sign in</h3></a
          >
        </div>
      </div>
    </nav>
    <!-- ====== SLUT NAVBAR ====== -->

    <!-- ====== HUVUDINNEHÅLL ====== -->
    <div class="content-row">
      <!-- Filterpanel (fast vänsterspalt) -->
      <!-- Backend: checkboxarna kopplas till filterlogik via JS -->
      <aside id="filter-panel" class="filters-box">
        <h3>Filter</h3>

        <label>
          <input
            type="checkbox"
            class="filter-checkbox"
            data-filter="platser"
          />
          Platser
        </label>

        <label>
          <input type="checkbox" class="filter-checkbox" data-filter="kott" />
          Kött val
        </label>

        <h3>Platser</h3>
        <label>
          <input
            type="checkbox"
            class="filter-checkbox"
            data-filter="platser"
          />
          Amos Kebab
        </label>

        <label>
          <input type="checkbox" class="filter-checkbox" data-filter="kott" />
          Bogdans Pizzeria
        </label>
        <label>
          <input
            type="checkbox"
            class="filter-checkbox"
            data-filter="platser"
          />
          KFC
        </label>

        <label>
          <input type="checkbox" class="filter-checkbox" data-filter="kott" />
          Wing Wongs Ricefarm
        </label>

        <h3>Kött val</h3>
        <label>
          <input
            type="checkbox"
            class="filter-checkbox"
            data-filter="platser"
          />
          Nötkött
        </label>

        <label>
          <input type="checkbox" class="filter-checkbox" data-filter="kott" />
          Kyckling
        </label>
        <label>
          <input
            type="checkbox"
            class="filter-checkbox"
            data-filter="platser"
          />
          Fisk
        </label>

        <label>
          <input type="checkbox" class="filter-checkbox" data-filter="kott" />
          Vegetariskt
        </label>
      </aside>

        <a href="/FrontEnd/logout-login/login.html">

              <img
                class="gallery-image"
                src="../Images/lickitung.jpg"

              />

                <h4>Grillad lax med örter</h4>
