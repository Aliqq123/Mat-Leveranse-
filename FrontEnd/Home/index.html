<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foodie</title>

    <!-- Delad layout-styling (navbar, galleri, filter) -->
    <link rel="stylesheet" href="../Home-log-in/style.css" />

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!-- ====== NAVBAR (gäst-vy, utan inloggning) ====== -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <!-- Logotyp länkad till startsidan -->
        <a class="navbar-brand" href="../Home/index.html">
          <img id="logo" src="../Images/foodie.png" alt="Foodie" />
        </a>

        <!-- Hamburgarmeny för mobil -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"></li>
          </ul>
          <!-- Inloggningsknapp — synlig för icke-inloggade användare -->
          <a class="navbar-brand" href="../logout-login/login.html"
            ><h3 class="LogSign login">Login</h3></a
          >
          <a class="navbar-brand" href="../logout-login/sign.html"
            ><h3 class="LogSign signup">Sign in</h3></a
          >
        </div>
      </div>
    </nav>
    <!-- ====== SLUT NAVBAR ====== -->

    <!-- ====== HUVUDINNEHÅLL ====== -->
    <div class="content-row">
      <!-- Filterpanel (fast vänsterspalt) -->
      <!-- Backend: checkboxarna kopplas till filterlogik via JS -->
      <aside id="filter-panel" class="filters-box">
        <h3>Filter</h3>

        <label>
          <input
            type="checkbox"
            class="filter-checkbox"
            data-filter="platser"
          />
          Platser
        </label>

        <label>
          <input type="checkbox" class="filter-checkbox" data-filter="kott" />
          Kött val
        </label>

        <h3>Platser</h3>
        <label>
          <input
            type="checkbox"
            class="filter-checkbox"
            data-filter="platser"
          />
          Amos Kebab
        </label>

        <label>
          <input type="checkbox" class="filter-checkbox" data-filter="kott" />
          Bogdans Pizzeria
        </label>
        <label>
          <input
            type="checkbox"
            class="filter-checkbox"
            data-filter="platser"
          />
          KFC
        </label>

        <label>
          <input type="checkbox" class="filter-checkbox" data-filter="kott" />
          Wing Wongs Ricefarm
        </label>

        <h3>Kött val</h3>
        <label>
          <input
            type="checkbox"
            class="filter-checkbox"
            data-filter="platser"
          />
          Nötkött
        </label>

        <label>
          <input type="checkbox" class="filter-checkbox" data-filter="kott" />
          Kyckling
        </label>
        <label>
          <input
            type="checkbox"
            class="filter-checkbox"
            data-filter="platser"
          />
          Fisk
        </label>

        <label>
          <input type="checkbox" class="filter-checkbox" data-filter="kott" />
          Vegetariskt
        </label>
      </aside>

      <!-- Matgalleri — bilder laddas dynamiskt från backend -->
      <section id="food-gallery" class="gallery">
        <!-- JS fyller detta -->
      </section>
    </div>
    <!-- ====== SLUT HUVUDINNEHÅLL ====== -->

    <!-- Koden som fanns i section är nu om skriven till js, så att vi kan bearbeta dig med loopar såsom (whileloop)-->
    <script>
      // Här är koden för att visa producten på hemsidan (obs du behöver ladd ner images själv)
      async function loadProducts() {
        const res = await fetch("/api/products");
        const products = await res.json();

        const container = document.getElementById("food-gallery");

        container.innerHTML = products
          .map(
            (p) => `
          <a href="../logout-login/login.html">
            <button style="all: unset">
              <div class="gallery-item">
                <img class="gallery-image" src="${p.product_image}" alt="food" />
                <div class="gallery-overlay">
                  <h4>${p.product_name}</h4>
                  <p>${p.product_description}</p>
                  <p>Pris: ${p.product_price} kr</p>
                </div>
              </div>
            </button>
          </a>
        `,
          )
          .join("");
      }

      loadProducts();
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
