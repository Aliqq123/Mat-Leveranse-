<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kundvagn</title>

    <!-- Kundvagnsstyling -->
    <link rel="stylesheet" href="../Cart/cart.css" />

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!-- ====== NAVBAR ====== -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <!-- Logotyp -->
        <a class="navbar-brand" href="../Home-log-in/home.html">
          <img id="logo" src="../Images/foodie.png" alt="Foodie" />
        </a>

        <!-- Hamburgarmeny för mobil -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <!-- Länk till kontakt -->
                <li class="nav-item">
              <a class="nav-link" href="../Contact/contact.html">
                <img id="userlogo" src="../Images/details.png" alt="User" />
              </a>
            </li>
            <!-- Länk till kundvagn (aktuell sida) -->
            <li class="nav-item">
              <a class="nav-link" href="../Cart/cart.html">
                <img id="cartlogo" src="../Images/cart.png" alt="Cart" />
              </a>
            </li>

            <!-- Länk till adminpanel -->
            <li class="nav-item">
              <a
                class="nav-link"
                id="nav-admin-link"
                href="../admin/admin.html"
              >
                <img id="adminlogo" src="../Images/admin.png" alt="Admin" />
              </a>
            </li>

            <!-- Länk till användarprofil -->
            <li class="nav-item">
              <a class="nav-link" href="../User/user.html">
                <img id="userlogo" src="../Images/user.png" alt="User" />
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- ====== SLUT NAVBAR ====== -->

    <!-- ====== KUNDVAGN ====== -->
    <!-- Backend: cart-container fylls med ordrar kopplade till inloggad användare -->
    <div id="cart-container" class="cart-container">
      <!-- Lista med varukorgsartiklar -->
      <!-- Backend: varje cart-item renderas dynamiskt med produkt-id som data-attribut -->
      <div id="cart-items-wrapper" class="cart-wrapper"></div>
      <!-- Slut cart-items-wrapper -->

      <!-- Summering och kassa -->
      <div id="cart-summary" class="summary-section">
        <!-- Backend: totalpriset beräknas och injiceras här -->
        <h1 id="cart-total">Total: 0 kr</h1>

        <div class="checkout-actions">
          <!-- Avbryt-knapp — navigerar tillbaka till matgalleriet -->
          <button id="btn-cancel" class="btn btn-cancel">Avbryt</button>

          <!-- Kassaknapp — skickar order till backend -->
          <button id="btn-checkout" class="btn btn-purchase">
            Gå till kassan
          </button>
        </div>
      </div>
    </div>
    <!-- ====== SLUT KUNDVAGN ====== -->

    <script src="cart.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
